<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
  main { width: 1600px; height: 900px; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 24px; padding: 52px 62px 48px; background: #f3f6f9; color: #132743; }
  header { border-left: 8px solid #1c6481; padding-left: 24px; }
  h1 { margin: 0; font-size: 50px; line-height: 1.25; font-weight: 700; overflow-wrap: anywhere; }
  p { margin: 10px 0 0; font-size: 26px; line-height: 1.4; color: #4a6078; }
  p:empty { display: none; }
  section { min-height: 0; min-width: 0; display: grid; border: 1px solid #dbe4ed; border-radius: 24px; padding: 26px 30px; background: #fff; }
  #diagram { min-height: 0; min-width: 0; }
  #diagram > svg { display: block; width: 100%; height: 100%; }
</style>
<main>
  <header><h1 id="title"></h1><p id="summary"></p></header>
  <section><div id="diagram"></div></section>
</main>
<script>
  const label = ({ label, detail }) => ({ label, desc: detail })
  const nodeItem = { type: 'workbench-article-node' }
  const layouts = {
    concept_map: (d) => [
      'hierarchy-mindmap-branch-gradient-compact-card',
      { root: { label: d.center, children: d.items.map(label) } },
      { item: nodeItem },
    ],
    tree: (d) => [
      'hierarchy-tree-lr-curved-line-compact-card',
      { root: { ...label(d.root), children: d.branches.map((branch) => ({
        ...label(branch), children: branch.children.map(label),
      })) } },
      { item: nodeItem },
    ],
    process: (d) => ['list-row-simple-horizontal-arrow', { lists: d.items.map(label) }],
    timeline: (d) => ['sequence-timeline-simple', { sequences: d.items.map(label) }],
    cycle: (d) => ['sequence-circular-simple', { sequences: d.items.map(label) }],
    comparison: (d) => [
      'compare-hierarchy-row-letter-card-compact-card',
      { compares: d.columns.map((column) => ({
        label: column.label, children: column.items.map((point) => ({ label: point })),
      })) },
      {
        structure: { type: 'compare-hierarchy-row', columnWidth: 340, gap: 20, itemGap: 10, itemPadding: 10 },
        items: [{ ...nodeItem, compact: true, heading: true }, { ...nodeItem, compact: true }],
      },
    ],
    pie: (d) => [
      'chart-pie-donut-plain-text',
      { values: d.segments.map(({ label, value }) => ({ label: label + ' ' + value + '%', value })) },
    ],
  }

  function registerArticleNode(antv) {
    const { registerItem, getItemProps, jsx, Group, Rect, ItemLabel, ItemDesc } = antv
    registerItem(nodeItem.type, {
      composites: ['label', 'desc'],
      component(props) {
        const [{ datum, indexes, themeColors, width = 264, compact = false, heading = false }, groupProps] =
          getItemProps(props, ['width', 'compact', 'heading'])
        const height = compact ? 88 : 146
        const hasDetail = Boolean(datum.desc) && !compact
        const textArea = { x: 16, width: width - 32, indexes, wordWrap: true, alignVertical: 'middle' }
        return jsx(Group, {
          ...groupProps,
          children: [
            jsx(Rect, { width, height, rx: 12, fill: heading ? themeColors.colorPrimaryBg : '#fff', stroke: '#d8e2ed' }),
            jsx(Rect, { x: 1, y: 14, width: 4, height: height - 28, rx: 2, fill: themeColors.colorPrimary }),
            jsx(ItemLabel, {
              ...textArea, y: hasDetail ? 9 : 12, height: hasDetail ? 47 : height - 24,
              fontSize: heading ? 23 : 20, lineHeight: 1.18, fill: '#132743', children: datum.label,
            }),
            hasDetail ? jsx(ItemDesc, {
              ...textArea, y: 58, height: 77, fontSize: 16, lineHeight: 1.16, fill: '#4a6078', children: datum.desc,
            }) : null,
          ],
        })
      },
    })
  }

  window.renderArticleInfographic = async (diagram) => {
    document.querySelector('#title').textContent = diagram.title
    document.querySelector('#summary').textContent = diagram.subtitle
    const container = document.querySelector('#diagram')
    if (window.renderCustomArticleDiagram?.(diagram, container)) return
    await document.fonts.ready
    const antv = window.AntVInfographic
    registerArticleNode(antv)
    const [template, data, design] = layouts[diagram.diagram_type](diagram)
    const infographic = new antv.Infographic({
      container,
      width: container.clientWidth,
      height: container.clientHeight,
      template,
      design,
      padding: 20,
      themeConfig: {
        colorPrimary: '#1c6481',
        palette: ['#1c6481', '#17776d', '#7159a1', '#9f5928', '#a24761', '#3867a0'],
        base: { text: { 'font-family': getComputedStyle(document.body).fontFamily } },
      },
    })
    await new Promise((resolve, reject) => {
      const timeout = setTimeout(() => reject(new Error('Infographic did not render')), 6000)
      infographic.on('error', (error) => {
        clearTimeout(timeout)
        reject(error)
      })
      infographic.on('rendered', () => {
        clearTimeout(timeout)
        resolve()
      })
      infographic.render({ data })
    })
    await document.fonts.ready
    const labels = container.querySelectorAll('svg text, svg foreignObject span')
    if (![...labels].some((node) => node.textContent.trim())) throw new Error('Infographic is empty')
  }
</script>
