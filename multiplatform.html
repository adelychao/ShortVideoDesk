<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>多平台视频下载 · 本地工作台</title>
<style>
:root{color-scheme:light;--paper:#f5f4ef;--ink:#24342b;--muted:#68746c;--line:#d7ddd4;--green:#27633e}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1080px;margin:auto;padding:40px 32px 70px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px}.eyebrow{color:var(--muted);font-size:12px;letter-spacing:.08em}header a,a{color:var(--green);text-decoration:none}h1{font-size:35px;line-height:1.35;letter-spacing:-.03em;margin:27px 0 12px}h2{font-size:20px;margin:0}h3{font-size:17px;line-height:1.6;margin:5px 0 9px}p{color:var(--muted);margin:0 0 18px}textarea{width:100%;min-height:105px;background:white;border:1px solid #b5c2b7;border-radius:7px;padding:15px;font:inherit;resize:vertical}textarea:focus{outline:2px solid #73957c;outline-offset:2px}.actions{display:flex;align-items:center;gap:18px;margin:12px 0 26px}button{background:var(--green);color:white;border:0;border-radius:5px;padding:11px 24px;font:inherit;cursor:pointer}button:disabled{opacity:.6}.hint{font-size:12px;color:var(--muted)}#error{color:#a33a30;white-space:pre-wrap}.section-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin:30px 0 14px}.platforms{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}.platform{padding:12px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.platform b{font-size:14px}.pill{font-size:11px;padding:2px 8px;border-radius:3px;background:#e7eae4;color:#677368;white-space:nowrap}.ok{background:#e1ecdf;color:#2e6438}.limited{background:#f0e5dc;color:#8b5b39}.failed{background:#f1e0dc;color:#963e31}select{border:1px solid #c4cec3;border-radius:4px;background:transparent;padding:6px 10px;color:var(--ink);font:inherit}article{border-top:1px solid var(--line);padding:22px 0;display:grid;grid-template-columns:1fr auto;gap:14px}.job-meta{font-size:12px;color:var(--muted)}.status{font-size:12px;font-weight:600;white-space:nowrap}.details{margin:8px 0;color:#526358;font-size:13px}.files{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0}.files a{border-bottom:1px solid #90a28e;font-size:13px}.path{font:11px/1.7 ui-monospace,Consolas,monospace;overflow-wrap:anywhere;color:var(--muted)}.warning{font-size:12px;color:#93663e;margin-top:6px}.progress{height:3px;background:#dce3d8;margin-top:12px}.progress span{display:block;height:100%;background:var(--green)}.empty{padding:25px 0;color:var(--muted)}footer{border-top:1px solid var(--line);padding-top:18px;margin-top:22px;font-size:12px;color:var(--muted)}.error-code{font-size:11px;color:#917c65}
@media(max-width:650px){main{padding:24px 18px}h1{font-size:27px}.platforms{grid-template-columns:repeat(2,1fr)}.platform{padding:10px}.actions{align-items:flex-start;flex-direction:column;gap:8px}.section-head{flex-wrap:wrap}article{grid-template-columns:1fr}.status{grid-row:1;justify-self:start}}
</style>
</head>
<body><main>
<header><span class="eyebrow">视频采集工作台 / LOCAL</span><a href="#history">下载记录</a></header>
<h1>一个链接，保存视频与封面。</h1>
<p>粘贴公开视频链接或分享文案，自动识别平台并保存到本机。仅使用匿名会话，不读取个人浏览器 Cookie。</p>
<form id="form"><label for="url" class="hint">视频链接或分享文案</label><textarea id="url" placeholder="粘贴抖音、小红书、B站、微博、TikTok、Instagram、X 或 Reddit 的单条作品链接…" required></textarea>
<div class="actions"><button id="submit" type="submit">解析并下载</button><span class="hint">视频 · 封面 · 元数据 · 本地存档</span></div></form><div id="error" role="alert"></div>
<section aria-labelledby="platform-title"><div class="section-head"><h2 id="platform-title">平台实测</h2><span class="hint" id="validation-date">正在读取实测记录</span></div><div class="platforms" id="platforms"></div><p class="hint" style="margin-top:10px">状态来自本机样本测试，不能代表所有作品均可下载。需要登录、验证或受网络限制的内容会明确提示。</p></section>
<section id="history"><div class="section-head"><h2>本地下载记录 <span class="hint" id="counts"></span></h2><select id="filter" aria-label="筛选下载记录"><option value="all">全部平台</option></select></div><div id="jobs" aria-live="polite">正在读取…</div></section>
<footer>素材按下载日期、平台和作品 ID 存档；原抖音历史继续保留。当前处理单条视频，图集与直播暂未接入。</footer>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let names={},jobCache=[];
const duration=s=>{s=Math.round(Number(s)||0);return `${Math.floor(s/60)}分${String(s%60).padStart(2,'0')}秒`};
function renderJobs(){const selected=$('#filter').value;const rows=jobCache.filter(j=>selected==='all'||(j.platform||j.result?.metadata?.platform_id||'douyin')===selected);$('#counts').textContent=`${jobCache.filter(j=>j.status==='已完成').length} 条完成 / ${jobCache.length} 条记录`;$('#jobs').innerHTML=rows.length?rows.map(j=>{const m=j.result?.metadata;const platform=j.platform||m?.platform_id||'douyin';const active=['排队','进行中'].includes(j.status);const links=j.result?Object.keys(j.result.files).map(k=>`<a href="/api/jobs/${encodeURIComponent(j.id)}/files/${encodeURIComponent(k)}">${esc(({video:'视频文件',cover:m?.cover_source==='video_frame'?'首帧预览':'封面图片',metadata:'元数据 JSON',note:'元数据 Markdown'})[k]||k)}</a>`).join(''):'';return `<article data-job-id="${esc(j.id)}"><div><div class="job-meta">${esc(names[platform]||platform)} · ${esc(j.created_at?.slice(0,19).replace('T',' '))}</div><h3>${esc(m?.title||j.title||'正在处理作品')}</h3><div>${esc(j.message||'')}${active&&j.percent!=null?' · '+esc(j.percent)+'%':''}</div>${m?`<div class="details">${esc(m.author||'作者信息未提供')} · ${esc(m.width)}×${esc(m.height)} · ${duration(m.duration_seconds)} · ${(m.size_bytes/1024/1024).toFixed(1)} MiB${m.audio_codec?'':' · 无音频流'}</div>`:''}${j.error_code?`<div class="error-code">${esc(j.error_code)}</div>`:''}${active?`<div class="progress"><span style="width:${Math.max(2,Math.min(100,Number(j.percent)||2))}%"></span></div>`:''}<div class="files">${links}</div>${(j.result?.warnings||[]).map(w=>`<div class="warning">${esc(w)}</div>`).join('')}${j.result?`<div class="path">${esc(j.result.output_dir)}</div>`:`<div class="path">${esc(j.source)}</div>`}</div><span class="status ${j.status==='失败'?'failed':''}">${esc(j.status)}</span></article>`}).join(''):'<div class="empty">暂无记录，粘贴一条公开视频链接开始。</div>'}
async function refresh(){try{const response=await fetch('/api/jobs');if(!response.ok)throw Error();jobCache=await response.json();renderJobs()}catch(e){$('#error').textContent='无法连接本地服务，请检查启动窗口。'}}
async function platforms(){const response=await fetch('/api/platforms');if(!response.ok)throw Error('无法读取平台目录');const data=await response.json();names=Object.fromEntries(data.map(p=>[p.id,p.name]));$('#platforms').innerHTML=data.map(p=>{let v=p.validation;const cls=p.validation_status==='已通过'?'ok':p.validation_status==='未验证'?'':'limited';const count=v.tested?` · ${v.passed}/${v.tested}`:'';return `<div class="platform"><b>${esc(p.name)}</b><span class="pill ${cls}">${esc(p.validation_status+count)}</span></div>`}).join('');$('#filter').innerHTML='<option value="all">全部平台</option>'+data.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');const date=data.map(p=>p.validation.tested_at||'').sort().pop();$('#validation-date').textContent=date?'最近测试 '+date.slice(0,16).replace('T',' '):'尚未完成本轮测试';renderJobs()}
$('#form').onsubmit=async event=>{event.preventDefault();$('#error').textContent='';$('#submit').disabled=true;try{const response=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:$('#url').value})});const data=await response.json();if(!response.ok)throw Error(typeof data.detail==='string'?data.detail:'请输入有效的单条作品链接');await refresh()}catch(e){$('#error').textContent=e.message}finally{$('#submit').disabled=false}};
$('#filter').onchange=renderJobs;
Promise.all([platforms(),refresh()]).catch(e=>$('#error').textContent=e.message);setInterval(refresh,2000);
</script></body></html>
